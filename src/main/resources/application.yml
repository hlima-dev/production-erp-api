spring:
  application:
    name: erp-producao
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_producao}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-min-32-caracteres}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}      # 15 min, em ms
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 dias, em ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hlima.erp: ${LOG_LEVEL:INFO}
